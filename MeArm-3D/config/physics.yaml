# =============================================================================
# ArmPilot · MeArm 物理仿真参数（MuJoCo Physics Backend）
# -----------------------------------------------------------------------------
# ⚠️ 本文件**只放物理量**。运动学量（连杆长度 / 关节轴 / 关节限位 / 标定 /
#    TCP / HOME）一律来自 config/robot.yaml —— 那是前后端 + 固件共用的唯一真值，
#    **绝不在这里抄第二份**（抄了必然漂移，见 docs/ARCHITECTURE_ANALYSIS.md §6.4）。
#
# ⚠️⚠️ 数据来源与诚实声明（spec §37）
#   本文件里**没有任何一个数字来自对本台 meArm 的实测**。取值来源分三类：
#     [公开] 开源 meArm 标称尺寸、MG90S 舵机公开规格书
#     [估算] 由 config/robot.yaml 的 geometry.size × 材料密度推算
#     [经验] 控制增益类参数，取量级合理值待调
#   因此当前模型是 **Level 3→4（参数化物理仿真）**，
#   **不是** Level 5（真实机械臂标定模型）。README 必须显式声明这一点。
#   每一个值都可通过 §7 `calibration` 段被实测值替换，无需改代码。
#
# 单位：**SI**。length=m, mass=kg, time=s, angle=rad, torque=N·m
#       （与 robot.yaml 的 mm/degree 不同 —— 转换只在 simulation/mujoco/units.py 一处做）
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# 1. 仿真时间步（spec §23）
#    ⚠️ 关键原则：**渲染帧率不能决定物理仿真步长**。
#    三者由三个不同的循环驱动，互不耦合（网络卡顿不得让物理时间停住）。
# -----------------------------------------------------------------------------
timestep:
  physics: 0.001        # 物理积分步长 = 1 kHz
  control: 0.010        # 控制环周期 = 100 Hz（舵机目标更新）
  render: 0.0333        # 渲染目标 = 30 FPS（仅影响 Viewer 与状态发布，不影响物理）

solver:
  # implicitfast：对含阻尼/armature 的关节链数值稳定，且比 implicit 快
  integrator: implicitfast
  solver: Newton
  iterations: 80
  tolerance: 1.0e-10
  # 关节速度上限的数值保护（rad/s）。设 0 表示不限。
  # 取值需高于舵机最大角速度（见 §3 servo.max_velocity.rad_per_s）
  max_vel: 0.0

# -----------------------------------------------------------------------------
# 2. 重力（spec §18）
#    右手系 Z-up ⇒ 重力沿 -Z。设 `0 0 0` 即为**关重力对照实验**，
#    Gravity Test 用它区分"重力造成的位移"与"控制器造成的位移"。
# -----------------------------------------------------------------------------
gravity: [0.0, 0.0, -9.81]

# -----------------------------------------------------------------------------
# 3. 舵机模型（spec §13）
#    真实 MeArm 用 MG90S。MuJoCo 里不能假设 target angle = instant angle，
#    必须走：target → position controller → torque → joint dynamics。
#
#    实现分工（重要）：
#      MuJoCo 侧  position actuator（kp / kv / forcerange）→ 产生力矩
#      Python 侧  速率限制（max_velocity）→ 把阶跃目标变成斜坡（舵机固有速度上限）
#    两者合起来才是"舵机"，缺一不可：
#      只有 kp/forcerange ⇒ 小信号响应过快，失去"舵机很慢"这一真实特征；
#      只有速率限制     ⇒ 无扭矩上限，重载时照样瞬移。
# -----------------------------------------------------------------------------
servo:
  # MG90S 公开规格（[公开]）：堵转 ≈2.2 kg·cm @6V / 工作 ≈1.8 kg·cm @4.8V
  # 取工作扭矩作为 forcerange（保守：宁可低估驱动能力，不要凭空造出一个超人舵机）
  max_torque_nm: 0.1765       # [公开] 1.8 kg·cm = 0.1765 N·m
  stall_torque_nm: 0.2158     # [公开] 2.2 kg·cm = 0.2158 N·m（仅记录，不用于 forcerange）

  # 位置环增益（[经验]）。舵机内部是高增益位置环，靠 forcerange 限幅体现"堵转"。
  # 若 kp 太小，机械臂会因重力明显下垂到稳态误差；
  # 若 kp 太大，数值刚硬、接触时易抖。当前取值使 0.1 rad 误差即接近饱和。
  kp: 5.0                     # N·m/rad
  kv: 0.5                     # N·m·s/rad（阻尼，抑制超调）

  # 速度上限（[公开]）：MG90S 无负载 0.1 s / 60° ⇒ 600 °/s；带载更低。
  max_velocity:
    deg_per_s: 573.0          # 保守取 573°/s（≈10 rad/s），略低于无负载值
    rad_per_s: 10.0

  # 关节侧固有损耗（[经验]）
  damping: 0.01               # 关节粘性阻尼 N·m·s/rad
  frictionloss: 0.005         # 库仑摩擦 N·m（静止保持能力；不可设为"无限大"）
  armature: 0.0005            # 转子+齿轮箱反射惯量 kg·m²（小舵机量级）

# -----------------------------------------------------------------------------
# 4. 惯性参数（spec §11）
#    mode: explicit      —— 用本节的质量与尺寸显式生成 <inertial>（默认，可读可换）
#          geom_density  —— 交给 MuJoCo 按 geom 体积 × 密度自动估算
#
#    质量来源：由 config/robot.yaml 的 link.geometry 体积 × 材料密度推算（[估算]）。
#    密度（[公开]）：亚克力板 1.19 g/cm³；舵机按等效体积折算。
#
#    ⚠️ 这些值**没有一个是称出来的**。替换成实测值的唯一入口就是本节 ——
#       改完重跑 gen_model.py 即可，代码一行不用动（spec §11 的要求）。
# -----------------------------------------------------------------------------
inertia:
  mode: explicit

  materials:
    acrylic: 1190.0           # kg/m³  亚克力（PMMA）板
    servo_body: 1500.0        # kg/m³  MG90S 壳体等效密度（含内部齿轮/电机质量）

  # shape 决定 <inertial> 的 diaginertia 估算方式：
  #   box   —— 均质长方体，size=[a,b,c]，I = m/12 · (b²+c², a²+c², a²+b²)
  #   rod   —— 沿 +Z 的均质细杆，length=L，Ixx=Iyy=m·L²/12，Izz≈0（取 1e-9 保护）
  #   point —— 近似质点，I = m·(0.02)²/6 量级，用于极小件
  # com 是**质心在 body 坐标系中的位置**（m）—— 对旋转惯量影响最大的一项，
  # 偏置过大等价于凭空增加重力矩。连杆取"几何中段"，故 ≈ [0,0,length/2]。
  bodies:
    # 底盘：94×82×7 亚克力板 + 四角螺栓 + S9 舵机
    base_link:
      mass: 0.080
      com: [0.0, 0.0, 0.006]
      shape: box
      size: [0.094, 0.082, 0.020]
    # 转盘 66×60×7 + 两片立柱侧板 30×6×22 + S7 舵机
    column_link:
      mass: 0.056
      com: [0.0, 0.0, 0.030]
      shape: rod
      length: 0.060
    # 两片大臂板 22×5×74 + 端盖 + 横撑 + S8 舵机
    upper_arm_link:
      mass: 0.037
      com: [0.0, 0.0, 0.040]
      shape: rod
      length: 0.080
    # 两片小臂板 18×5×68 + 端盖 + 横撑
    forearm_link:
      mass: 0.019
      com: [0.0, 0.0, 0.040]
      shape: rod
      length: 0.080
    # 腕座 22×26×11 + S6 舵机 + 爪铰轴
    tool_link:
      mass: 0.022
      com: [0.0, 0.0, 0.020]
      shape: rod
      length: 0.040
    # 两片爪 9×4.5×34
    jaw_link:
      mass: 0.0033
      com: [0.0, 0.0, 0.017]
      shape: point

# -----------------------------------------------------------------------------
# 5. 碰撞与摩擦（spec §15 / §16 / §17）
#    本阶段必须实现：臂↔地面 / 臂↔自身 / 臂↔工作台。
#
#    ⚠️ 不能"所有 geom 全部互相碰撞"：相邻连杆在关节处必然几何重叠，
#       全开会让求解器每步都在处理一堆本不该存在的穿透，仿真直接不稳。
#       做法：① geom 分组 contype/conaffinity ② 相邻 body 对加 <exclude>
# -----------------------------------------------------------------------------
contact:
  # MuJoCo friction = [滑动, 扭转, 滚动]
  # ⚠️ 禁止为了"看起来稳定"把 friction 调成无限大（spec §17）。
  #    这里取的是[经验]合理值：静摩擦略大于动摩擦，扭转摩擦小两个量级。
  friction: [1.0, 0.005, 0.0001]
  solref: [0.02, 1.0]         # 接触刚度/阻尼时间常数
  solimp: [0.9, 0.95, 0.001]  # 接触阻抗（软一点更稳，硬了易抖）
  margin: 0.001               # 接触探测余量 m
  condim: 3                   # 3 = 只算法向 + 两个切向（足够，不引入扭转摩擦复杂度）

  # 碰撞分组位掩码。规则：A 与 B 碰撞 ⟺ (A.contype & B.conaffinity) != 0
  groups:
    world: 1                  # 地面 / 工作台
    arm: 2                    # 机械臂连杆

  # 相邻连杆相连处必然重叠 ⇒ 显式排除，否则产生"自穿模"伪接触
  exclude_pairs:
    - [base_link, column_link]
    - [column_link, upper_arm_link]
    - [upper_arm_link, forearm_link]
    - [forearm_link, tool_link]
    - [tool_link, jaw_link]

  # ---------------------------------------------------------------------------
  # 碰撞几何（spec §6：Visual / Collision 分离，第一版**只用 primitive**）
  #
  # 为什么不用 mesh：更稳定、易调摩擦、易调速度、易定位物理问题。
  # 尺寸是**运动包络**（设计值），不是精确外形 —— 例如立柱的 capsule 要能
  # 代表"转盘 + 两片侧板 + 舵机"这一整块，而不是逐件建模。
  #
  # 坐标：相对该 body 的坐标系，**米**。
  #   capsule 的 size = [半径, 半长]（MuJoCo capsule 沿 +Z，总长 = 2·半长 + 2·半径）
  #   box     的 size = [半x, 半y, 半z]
  # ---------------------------------------------------------------------------
  shapes:
    # 底盘：94×82×20 的整体包络（板 + 螺栓 + S9 舵机）
    base_link:
      type: box
      size: [0.047, 0.041, 0.010]
      pos: [0.0, 0.0, 0.010]
    # 立柱：从**底盘顶面**到肩枢轴（20 → 60mm）的杆状包络。
    #
    # ⚠️ 底端刻意停在底盘顶面（z=20mm）。若一路延伸到 z=0，capsule 会与地面
    #    **相切**，HOME 位立刻冒出一个"立柱戳在地上"的伪接触（实测 ncon=1，
    #    dist=0.000）。立柱在物理上位于底盘之上，其包络不该穿到底盘以下。
    #    该伪接触虽不产生动力学后果，但会污染 contact_count，并使
    #    "接触表里出现了哪些对"这一判据失去确定性 —— 所以必须消除。
    column_link:
      type: capsule
      size: [0.014, 0.006]
      pos: [0.0, 0.0, 0.040]
    # 大臂：肩 → 肘（0 → 80mm）
    upper_arm_link:
      type: capsule
      size: [0.013, 0.027]
      pos: [0.0, 0.0, 0.040]
    # 小臂：肘 → 腕（0 → 80mm）
    forearm_link:
      type: capsule
      size: [0.011, 0.029]
      pos: [0.0, 0.0, 0.040]
    # 腕/手部：腕 → 爪铰轴（0 → 40mm）
    tool_link:
      type: capsule
      size: [0.012, 0.008]
      pos: [0.0, 0.0, 0.020]
    # 夹爪：**沿开合轴（局部 X）**的一小段胶囊，中心落在开合铰轴上。
    #
    # 为什么沿 X 而不是沿 Z（MuJoCo 的 capsule 默认沿 +Z）：
    #   ① capsule 是轴对称体，绕自身轴旋转**不改变占位** ⇒ gripper 开合不会让
    #      碰撞包络跟着摆动。实测：沿 Z 摆放时，HOME 位（gripper=50°）的爪会斜
    #      甩到侧下方，把碰撞体伸到 TCP 之外约 34mm —— 后果是 shoulder 刚到 30°
    #      （工作空间中段，远非极端位形）就撞上工作台，台面从此污染全部测试。
    #   ② "爪沿腕轴向前伸出"这段语义**交给 tool_link 的碰撞体承担**（它正好覆盖
    #      腕段 0 → 40mm）。于是整个模型的碰撞包络**最远端恰好等于 TCP**，与
    #      ARCHITECTURE_ANALYSIS §7.1（TCP 挂在 tool body 的 +40mm）严格自洽。
    jaw_link:
      type: capsule
      size: [0.005, 0.010]
      pos: [0.0, 0.0, 0.0]
      quat: [0.70710678, 0.0, 0.70710678, 0.0]   # Ry(90°)：capsule 轴由 +Z 转 +X

  # 地面与工作台
  floor:
    enabled: true
    size: [0.6, 0.6, 0.01]    # 半边长 m ⇒ 1.2 m × 1.2 m
    z: 0.0
  table:
    # 工作台（spec §15 要求"臂↔工作台"碰撞）。
    #
    # 高度是**推导量**，判据有两条，缺一不可：
    #   ① 下限：臂在最深位形能碰到它（碰撞通路可被测试覆盖）
    #   ② 上限：**不得挡住常规作业位形**（否则臂会莫名其妙停在台面上）
    #
    # ⚠️ 该高度必须随机构变化**重新推导**，不能沿用历史值。历史值 30mm 是按旧几何
    #    （爪刚性固连小臂、TCP 最低 17.6mm）选的 —— 那时 tool 的 40mm 沿小臂伸出，
    #    "下扎"能多够到 31mm。爪改成**被动腕 + 恆水平**（见 robot.yaml 的 joints.tool）
    #    之后那 40mm 完全落在水平方向，碰撞包络整体抬高约 29mm。
    #
    # 2026-09-13 重推（scalar 探针 + 自检，实测值，见 docs/decisions.md D70）：
    #   ① 下限：下压位形（shoulder/elbow 同取真机上界）TCP z = 47.71mm，
    #      碰撞包络最低点（jaw 胶囊）= **32.71mm** ⇒ 台面顶 ≥ 32mm 才碰得到。
    #   ② 上限：扫 8 个代表性位形（含 HOME / JR(40,130) / 各限位角点）实测 ——
    #      顶面 ≤50mm 时只有"最深位形"那类会被碰到；**56mm 起 JR(40,130) 也被挡住**。
    #   取 **46mm**（离上限 10mm、离下限 13mm）⇒ 实测升幅 14.65mm、
    #      接触对恆为 jaw_link↔table、接触点落在台面顶面、无深穿透
    #      （dist 恆 ≈ +1.35mm —— 软接触出现「分离距离为正但确实施力」是常态，
    #       见 tests/sim/test_collision.py 开头的判据纪律）。
    # x 从 60mm 起（避开底盘包络 ±47mm），否则台面会与底盘初始重叠、把仿真顶住。
    enabled: true
    size: [0.11, 0.11, 0.015]   # 半边长 m ⇒ 220 × 220 × 30 mm
    pos: [0.17, 0.0, 0.031]     # 中心 m ⇒ 顶面 z = 46mm，x ∈ [60, 280] mm

# -----------------------------------------------------------------------------
# 6. 关节限位与耦合（spec §14）
#    ⚠️ 限位真值**只有一份**：config/robot.yaml。
#    本节只声明"生成器该如何把那份限位翻译进 MJCF"，不含任何具体角度。
#
#    背景（详见 docs/ARCHITECTURE_ANALYSIS.md §6.3）：`elbow` 存的是**绝对倾角**
#    且与 shoulder 通过平行四连杆耦合，其合法域在 MuJoCo 的"局部角"空间里是**斜的**，
#    任何单一 hinge range 都表达不了。因此：
#      MuJoCo hinge range ← 由 robot.yaml 限位算出的**保守外接**（只防数值爆炸）
#      真正的限位一致性 ← 由 controller（Go）与 python 控制层用同一份 yaml 校验
#    这个分工是刻意的，不是妥协 —— 见 ADR。
# -----------------------------------------------------------------------------
limits:
  source: robot.yaml          # 唯一真值源
  # MuJoCo hinge range 的外扩余量（度）。取 0 表示严格用外接区间。
  # 留一点余量是为了让"越界命令"能真的被物理引擎执行出越界动作，
  # 从而让上层校验的拒绝对称性**可被观测**（否则物理层先拒了，看不到上层拒）。
  range_padding_deg: 2.0

# -----------------------------------------------------------------------------
# 7. 标定接口（spec §38）—— 为后续真实机械臂标定预留，本阶段全部为"未标定"
# -----------------------------------------------------------------------------
calibration:
  calibrated: false           # ★ 本阶段恒为 false。true 需要真实实验数据支撑。
  # 以下字段将来由真机实验逐步填入；当前留空表示"沿用公开值/估算值"
  servo_offset: {}            # 例: {base: 0.0, shoulder: -0.5}  单位 deg（舵机角偏置）
  joint_scale: {}             # 例: {shoulder: 1.02}            关节角/舵机角 增益修正
  joint_zero: {}              # 例: {elbow: 112.6}              机械零位
  max_velocity: {}            # 逐关节实测速度上限（rad/s）
  max_torque: {}              # 逐关节实测扭矩上限（N·m）
  damping: {}                 # 逐关节实测阻尼
  friction: {}                # 逐关节实测摩擦

# -----------------------------------------------------------------------------
# 8. 数据记录（spec §34）—— 第一版就做，但只做 JSONL / CSV，不上数据库
# -----------------------------------------------------------------------------
recording:
  enabled: false
  format: jsonl               # jsonl | csv
  dir: .workbuddy/sim-runs    # 相对项目根；已被 .gitignore 的 _* 规则外的目录覆盖需确认
  fields:
    - sim_time
    - wall_time
    - joint_angle
    - joint_velocity
    - joint_torque
    - target_joint
    - end_effector
    - contact_count

# -----------------------------------------------------------------------------
# 9. 确定性（spec §33）
#    相同 model + 参数 + 初始状态 + 命令序列 ⇒ 高度一致的结果。
# -----------------------------------------------------------------------------
deterministic:
  seed: 0                     # MuJoCo 本身是确定性的；此 seed 供未来随机扰动/域随机化使用
  warmstart: auto             # auto | reset —— 影响 solver 热启动，跨次复位一致性靠它
