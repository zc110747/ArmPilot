# =============================================================================
# Robot Package · MeArm-V1（Golden Baseline）
# -----------------------------------------------------------------------------
# 本文件只放三样东西：**身份** / **能力声明** / **指针**。
# 真值（尺寸 / 关节 / 限位 / 标定 / 物理量）一律在 model.config 指向的 robot.yaml 里。
#
# ⚠️ 刻意**不写** dof / actuator_count —— 它们能从 robot.yaml 推导。
#    抄一份就是第二份真值，而它的漂移是静默的（改了关节表，这里的 4 不会自己变 5）。
#    推导结果见 `python core/python/robopkg/cli.py show mearm-v1`；
#    期望值写在 `core/tests/test_package_contract.py` 里。
#
# ⚠️ 本包是冻结基线：可以改的只有"怎么描述"，**不能改"它是什么"**。
# =============================================================================

id: mearm-v1
name: MeArm-V1

package:
  # manifest 结构版本；不兼容改动必须 +1
  format: 1
  # 包封装版本 —— 与 robot.yaml 的 `robot.version`（模型版本）**正交**，两者都要对
  version: 1.0.0

robot:
  type: robotic_arm

model:
  # 运动学 / 标定 / 限位真值（**唯一**真值源，三端共用）
  # ★ Phase 2 起随包走：路径只在 manifest 声明，解析只在 robopkg.declared_path()。
  config: robot-package/mearm-v1/model/robot.yaml
  # 物理量真值：本机为我们自己估算 ⇒ 这份文件本身即真值（顶层形态，无 driver 段）
  physics: robot-package/mearm-v1/physics/physics.yaml

simulation:
  # MeArm 的 MJCF 是**产物**：由 gen_model.py 从 robot.yaml 派生。
  # 它不是源 ⇒ 不进内容哈希（spec §19 要求忽略 generated）。
  mjcf: simulation/mujoco/mearm.xml
  generated_by: robot-package/mearm-v1/tools/gen_model.py
  # TCP site 名（mearm.xml 里就是 tcp）
  tcp_site: tcp

kinematics:
  # 包内**运动学引擎**实现（`KinematicsEngine` 接口的落地）。
  # ★ 前端 `RobotRegistry` 用 `import.meta.glob('robot-package/*/kinematics/engine.ts')`
  #   自动发现它；声明在这里的作用是**对账** —— 见
  #   `core/tests/test_package_contract.py::test_engine_entry_agrees_with_frontend_discovery`。
  engine:
    entry: robot-package/mearm-v1/kinematics/engine.ts
  fk:
    # engine = 用 Core 的通用链式 FK（读 RobotModel 的几何）。
    # 证据：SO-ARM101 的 forward() 也纯委托同一份 fk.ts ⇒ 它确实是通用的。
    type: engine
  ik:
    # MeArm 的逆解是**它自己的**：平面 2R + 偏航的解析解，
    # 且带 assertPlanar2R / assertPlanarWrist 适用性断言（不满足就直接拒绝）。
    type: custom
    entry: robot-package/mearm-v1/kinematics/ik.ts

capabilities:
  # position = 支持**位置目标**（需要逆解）
  position: true
  # MeArm 是 4 DOF 位置型机构：roll/pitch/yaw 填了也没用（它压根不解析）
  orientation: false
  gripper: true
  ik: true
  simulation: true
  # 本项目里有真机链路（串口 mARM）
  hardware: true

tests:
  # 机器人**专属测试数据**（测试执行框架在 Core，spec §10）。
  # ★ 路径只声明在这里：三端（pytest / vitest / 工具）都通过
  #   `core/python/robopkg/declared_path(id, "tests.cases")` 解析，不再各自拼路径。
  cases: robot-package/mearm-v1/tests/cases
  # ★ Phase 2 步⑤：包自带的**包内测试**（pytest 收集；`pytest.ini` 的 testpaths 覆盖）。
  #
  #   判据是"这条断言换台机器人还成立吗"：不成立 ⇒ 属于包。
  #   当前内容是 MeArm 的**构造事实**：连杆命名下的零位几何、被动腕 90° 锁定、
  #   `elbow` 绝对角 + 平行四连杆耦合、由被动腕派生出约 2° 的反例窗口…
  #   机制（随机位形 FK 对比 / 角点扫描 / 校验格式契约）留在 `tests/sim/`。
  #
  #   ★ 声明它的意义：契约测试会核对"目录存在 + 里面真的有 test_*.py"，
  #     于是"测试随包走"有机器判据，而不是 manifest 里一句没人看的注释。
  local: robot-package/mearm-v1/tests
  # 冻结真值文件：语义核心哈希的来源（改运动学/物理会被它拦下，改外观放行）
  # ★ 它盯的是"真值没被偷改"这个**机制**，不属于任何一台机器人 ⇒ 住 Core。
  frozen: core/baseline/baseline-kinematics-physics.json
  # 本包自带的工具（**完整清单**）：
  #   · 前两个是"生成/校验"类（产物与上游同步；黄金数据逐位复现）
  #   · 其余是 MeArm 的相机标定 / 纹理重投影 / 真机操作工具 —— 它们只服务这一台机器人，
  #     所以它们必须住在包里（Core 里出现 MeArm 的路径 = 架构已经破了）。
  # ★ 这份清单是**可执行契约**：core/tests/test_package_contract.py 会逐个断言"文件存在"，
  #   于是"工具搬走了但清单没改"会立刻报错，而不是等人去猜。
  tools:
    - robot-package/mearm-v1/tools/gen_model.py
    - robot-package/mearm-v1/tools/gen_mearm_v1_baseline.py
    - robot-package/mearm-v1/tools/mearm_hw.py
    - robot-package/mearm-v1/tools/capture_texture.py
    - robot-package/mearm-v1/tools/make_texture.py
    - robot-package/mearm-v1/tools/measure_roi.py
    - robot-package/mearm-v1/tools/fit_pivot.py
    - robot-package/mearm-v1/tools/fit_pose.py
    - robot-package/mearm-v1/tools/analyze_sweep.py
    - robot-package/mearm-v1/tools/segment_arm.py
    - robot-package/mearm-v1/tools/project_plates.py
    - robot-package/mearm-v1/tools/cam_stability.py
    - robot-package/mearm-v1/tools/verify_calib_repro.py
    - robot-package/mearm-v1/tools/verify_pose.py
