# =============================================================================
# ArmPilot · 机器人模型选择器（Robot Selector）
# -----------------------------------------------------------------------------
# ★ 本文件只回答一个问题：「当前该加载哪台机器人」。
#
#   允许放的：**指针** —— 文件路径、MJCF 里 site 的名字（「哪一份文件属于这台机器人」）。
#   禁止放的：**数值** —— 尺寸 / 关节 / 限位 / 标定 / 物理量 / TCP 偏移。
#             把它们抄进来就等于制造第二份真值：两边一旦不一致没人知道该信哪个，
#             而"改了机器人文件却没改这里"更是**静默**的。
#
# 三端共用（前端 / Go 后端 / Python 仿真）：
#   frontend  → src/robot/model/robotConfigRegistry.ts（构建期静态登记 + 本文件选路径）
#   backend   → internal/robot/registry.go
#   python    → simulation/mujoco/robotcfg.py:load_robot_selector()
#
# ⚠️ 改 `default` 会同时改变三端的行为，且**只影响「未显式指定机器人」的调用**。
#
# ❌ 曾经写在这里的一句话（已被实测证伪，留作反面记录）：
#    「所有既有测试都显式传 'mearm-v1'，所以改默认值不会静默改变它们测的对象。」
#    实测：把 default 改成 so-arm101 后 `vitest` **37 处失败**、`pytest` **13 处失败** ——
#    前端 `robotStore` 的模块初值就是 `loadRobotModel(defaultRobotId())`，
#    Python 侧的测试夹具虽然显式，但工具/CLI 不传 --robot 时也吃 default。
#    ⇒ 「切机器人」这件事必须有自己的开关（Phase 3 起由 `working-robot/manifest.yaml` 承担），
#      而不是让三端所有"未指定"的调用点共同依赖这一行。
# =============================================================================

version: 1

# 缺省机器人 id。未显式指定时用它。
default: mearm-v1

# id → 该机器人涉及的文件。路径一律是**仓库相对路径**（三端都按仓库根解析）。
robots:
  mearm-v1:
    name: MeArm-V1
    # Golden Baseline：这是被冻结的参考模型，禁止因为"适配抽象"而修改。
    # ★ Phase 2 起真值随包走（`robot-package/mearm-v1/model/`），路径与 manifest 逐字一致。
    config: robot-package/mearm-v1/model/robot.yaml
    # 物理量真值来源 = 我们自己估算 ⇒ 这份文件本身即真值（顶层形态，无 `driver:` 段）。
    physics: robot-package/mearm-v1/physics/physics.yaml
    simulation:
      # 留空 = MJCF 由 gen_model.py 从 robot.yaml 生成。
      # MeArm 走这条路线：几何/惯量/执行器全部从配置派生，产物 mearm.xml 由
      # test_generated_mjcf_is_in_sync_with_config 盯着与配置同步。
      mjcf: simulation/mujoco/mearm.xml
      # TCP site 名（MeArm 的 mearm.xml 里就是 "tcp"）
      tcpSite: tcp

  so-arm101:
    name: SO-ARM101
    # 官方模型派生（TheRobotStudio/SO-ARM100 @ eecbe3e0）——
    # 由 robot-package/so-arm101/tools/gen_so_arm101_robot_yaml.py 生成，**禁止手改**。
    config: robot-package/so-arm101/model/robot.yaml
    # 物理量真值 = **官方 MJCF**（顶层带 `driver:` 段 ⇒ 该文件不复制任何物理量，
    # 只放 ArmPilot 自己的驱动参数 + 审计快照）。
    physics: robot-package/so-arm101/physics/physics.yaml
    simulation:
      # 直接吃**官方 MJCF 原样**（不生成、不改一行）——
      # meshdir="assets" 指向同目录的 assets/，故官方模型零修改即可加载。
      mjcf: assets/models/so-arm101/official/so101_new_calib.xml
      # 官方 MJCF 里代表 TCP 的是 `gripperframe` site（不是 body）。
      # ⚠️ 它与 URDF 的 `gripper_frame_joint` 朝向相差 90°；取 MJCF 才能让
      #    FK 与 MuJoCo 一致。依据见 assets/models/so-arm101/official/SOURCE.md §4.2。
      tcpSite: gripperframe
