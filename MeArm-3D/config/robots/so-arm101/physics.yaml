# =============================================================================
# ArmPilot · SO-ARM101 物理仿真参数（MuJoCo Physics Backend）
# -----------------------------------------------------------------------------
# ⚠️⚠️ 本文件与 MeArm 的 config/physics.yaml **结构相同、真值来源不同**。
#
#    MeArm  : 物理量是**我们估算**的（公开规格 + 体积密度推算）⇒ physics.yaml 是唯一真值
#    SO-101 : 物理量**官方已经在 MJCF 里写全了** ⇒ 官方 MJCF 是唯一真值
#
#   所以本文件**刻意不复制任何物理量**。
#   把官方 MJCF 里的 damping / kp / mass 抄一份到这里，只会制造第二份真值：
#   两边一旦不一致，没人知道该信哪个，而"改了官方文件却没改这里"更是静默的。
#
#   本文件只做三件事：
#     §1 source    声明"真值在哪"（可审计的来源，含固定 commit 与 sha256）
#     §2 driver    ArmPilot **自己的**驱动参数（与机器人模型正交，不触碰官方文件）
#     §3 observed  **审计快照** —— 由 tools/inspect_so101_physics.py 从官方 MJCF 读出，
#                  再由同一个脚本 --check 逐值复核。它不是真值，是"真值的指纹"。
#     §4 官方**没有**声明的东西（显式列出，避免"以为有"）
#
# 单位：**SI**（length=m, mass=kg, time=s, angle=rad, torque=N·m）。
#      与 robot.yaml 的 mm/degree 不同 —— 转换只在 simulation/mujoco/units.py 一处做。
#
# ⚠️ 禁止为"让仿真更好看/更稳"而改官方 MJCF（spec「不得修改官方物理参数」）。
#    若确实需要偏离官方，只能改**本文件的 §2 driver**（运行期覆盖），
#    且必须在 docs/decisions.md 留一条 ADR 说明为什么 —— 官方文件本身保持逐字节原样。
# =============================================================================

version: 1

# -----------------------------------------------------------------------------
# 1. 真值来源（唯一）
# -----------------------------------------------------------------------------
source:
  # 物理量的唯一真值就是这份官方 MJCF。加载体 = `<mujoco model="so101_new_calib">`
  authority: official_mjcf
  model: assets/models/so-arm101/official/so101_new_calib.xml
  # 运动学量（连杆 / 关节轴 / 限位 / TCP）在 robot.yaml —— 与物理量分开，互不复制
  kinematics: config/robots/so-arm101/robot.yaml
  # 完整来源与 26 个 sha256 见 assets/models/so-arm101/official/SOURCE.md
  provenance: assets/models/so-arm101/official/SOURCE.md
  upstream:
    repo: https://github.com/TheRobotStudio/SO-ARM100
    commit: eecbe3e0a9ebb23e25ad7b2759b03884c6660903
    path: Simulation/SO101/so101_new_calib.xml
  # 官方文件**未被修改**（逐字节原样入库）—— 由 tests/sim 的哈希测试钉住
  modified: false

# -----------------------------------------------------------------------------
# 2. ArmPilot 驱动参数（与机器人模型正交）
#    这些是"我们怎么跑仿真"，不是"机器人是什么"。
#    ⇒ 改这里不改官方文件；Phase 6 在运行期用 mjOption 覆盖。
# -----------------------------------------------------------------------------
driver:
  timestep:
    # 物理积分步长。官方 MJCF **没有** <option> 段 ⇒ 生效值就是 MuJoCo 缺省 0.002。
    # 刻意与官方生效值保持一致 ⇒ **默认无需任何覆盖**（少一层"我们改了官方行为"的口子）。
    # 若将来要跑 1 kHz，改这里并在 Phase 6 做运行期覆盖，官方文件仍然不动。
    physics: 0.002
    # 控制环周期（舵机目标更新）。与物理步长解耦：网络卡顿不得让物理时间停住。
    control: 0.010
    # 渲染目标帧率（仅影响 Viewer 与状态发布）
    render: 0.0333

  # 确定性（spec §33）：相同 model + 参数 + 初态 + 命令序列 ⇒ 高度一致的结果。
  deterministic:
    # MuJoCo 本身确定性；此 seed 供未来随机扰动 / 域随机化使用
    seed: 0
    # auto | reset —— 影响 solver 热启动，跨次复位一致性靠它
    warmstart: auto

  # 数据记录（spec §34）。第一版只做 JSONL/CSV，不上数据库。
  recording:
    enabled: false
    format: jsonl
    dir: .workbuddy/sim-runs
    fields:
      - sim_time
      - wall_time
      - joint_angle
      - joint_velocity
      - joint_torque
      - target_joint
      - end_effector
      - contact_count

# -----------------------------------------------------------------------------
# 3. 审计快照（**读出来的，不是写出来的**）
#    ⚠️ 禁止手改本节。它的唯一合法来源是：
#         tools/inspect_so101_physics.py --check      （逐值复核）
#         tools/inspect_so101_physics.py --emit       （重新生成）
#    改动机器人模型 ⇒ 重跑 --check 若无输出即为同步；有差异则显式列出逐字段 diff。
#    这样「官方模型换了版本、但我们的快照没跟着走」会变成**会失败的检查**，
#    而不是一个静默的错误假设。
# -----------------------------------------------------------------------------
observed:
  # ---- 求解器 / 积分器（官方未声明，全部为 MuJoCo 缺省值 —— 实测确认）----
  option:
    timestep: 0.002
    # 0=Euler 1=RK4 2=implicit 3=implicitfast
    integrator: Euler
    # 0=PGS 1=CG 2=Newton
    solver: Newton
    iterations: 100
    tolerance: 1.0e-08
    gravity: [0.0, 0.0, -9.81]
    # 0=pyramidal 1=elliptic
    cone: pyramidal
    # 2=auto
    jacobian: auto

  # ---- 模型规模（用于"载入的确实是官方模型"这类冒烟判据）----
  model_size:
    nq: 6
    nv: 6
    nu: 6
    nbody: 8     # 含 world
    ngeom: 30
    nsite: 2     # baseframe + gripperframe
    nmesh: 13

  # ---- 关节侧（class "sts3215"）----
  joints:
    damping: 0.60
    frictionloss: 0.052
    armature: 0.028
    # ⚠️ 限位真值在 robot.yaml（取自 MJCF 满精度）。这里只是"生效区间"的旁证。
    type: hinge

  # ---- 执行器侧（class "sts3215"，6 个 <position>，逐个覆盖 forcerange）----
  actuators:
    kind: position
    # 官方注释说明：kp/kv 不是 LeRobot 舵机增益的一比一映射，
    # 而是按"舵机比例增益设为 16"从 RBE501-RL-arm-project 的公式换算而来。
    kp: 998.22
    kv: 2.731
    # class 里写的是 ±2.94，但 6 个 <position> **逐个覆盖**为 ±3.35 ⇒ 生效值 ±3.35
    forcerange: [-3.35, 3.35]
    # ctrlrange 是 joint range 的 6 位小数截断版（**不是**满精度）
    # ⇒ 仿真里可下发的控制量边界比关节限位略窄（≤ 3.7e-6 rad），属官方原样行为
    ctrlrange_source: joint_range_truncated_6dp
    # gear = 1 ⇒ 控制量单位 = 关节角（rad）；无 offset / 无 scale / 无 reverse
    gear: 1.0

  # ---- 几何 / 碰撞分类（17 视觉 + 13 碰撞）----
  geom_groups:
    # (contype, conaffinity, group) → 数量
    - { contype: 0, conaffinity: 0, group: 2, count: 17, role: visual }
    # ★ 碰撞几何 contype=conaffinity=1 ⇒ **相邻连杆之间默认会互相碰撞**
    #   且官方 MJCF **没有** <contact><exclude> ⇒ 见 §4 的显式记录
    - { contype: 1, conaffinity: 1, group: 3, count: 13, role: collision }
  geom_friction: [1.0, 0.005, 0.0001]

  # ---- 质量（官方逐 body 的 <inertial mass>，含 fullinertia）----
  # ⚠️ 官方给的是 **fullinertia**（6 分量）——比 MeArm 的 diaginertia 估算精确得多，
  #    因此 inerta.mode 对 SO-101 是 "official_full_inertia"（照抄，不推算）。
  inertia:
    mode: official_full_inertia
    bodies:
      base: 0.147
      shoulder: 0.100006
      upper_arm: 0.103
      lower_arm: 0.104
      wrist: 0.079
      gripper: 0.087
      moving_jaw_so101_v1: 0.012
    total_mass: 0.632006

# -----------------------------------------------------------------------------
# 4. 官方**没有**声明的东西（显式列出 —— 避免"以为有"）
#    这一节的存在本身就是一条纪律：把"缺失"写下来，
#    否则缺失会被默认成"应该有、大概没问题"。
# -----------------------------------------------------------------------------
not_declared_by_official:
  # ① 地面 / 工作台：官方 MJCF 里**没有** floor，也没有 table ⇒
  #    官方模型是"悬空"的，臂不会撞到任何东西。
  #    ArmPilot 的 Sim2Sim 若要复现"臂↔地面/台面"碰撞，必须**自己加**碰撞体 ——
  #    而那属于"改造官方模型"，需在 Phase 6 单独裁决（优先方案：不改官方文件，
  #    在运行期另挂 worldbody geom，并记录 ADR）。
  floor: false
  table: false
  # ② 相邻连杆的 <contact><exclude>：官方**没有**任何 exclude 对 ⇒
  #    13 个碰撞 geom 两两可碰，包含相邻连杆（它们在关节处必然几何重叠）。
  #    MeArm 侧是靠显式 exclude 对解决的（见 config/physics.yaml §5）。
  #    Phase 6 需实测"是否出现自穿模伪接触"，再裁决是否要在**运行期**加排除。
  contact_exclude_pairs: false
  # ③ 关节速度上限（舵机固有转速）：官方**没有**声明 ⇒
  #    MuJoCo 里位置执行器可以瞬时趋近目标（只有 kp/kv 与 forcerange 限制）。
  #    真实 STS3215 有转速上限；若 Sim2Sim 需要"舵机很慢"这一特征，
  #    必须在**控制层**（Python 侧）做速率限制 —— 与 MeArm 的做法一致。
  joint_velocity_limit: false
  # ④ 标定（offset / scale / zero）：官方 new_calib 版已把标定**烘进关节原点与限位**，
  #    没有独立的标定段。⇒ ArmPilot 侧不再叠加任何标定（见 robot.yaml 的 actuators.unit=joint）。
  calibration_block: false
  # ⑤ 地面真值 / 实测质量：官方数值来自 CAD（Onshape）导出，**不是**对具体一台实机称重的结果。
  #    这一点与 MeArm 侧 Level 3→4 的声明同级，README 必须同样显式声明。
  measured_mass: false
