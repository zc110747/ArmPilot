[pytest]
# 默认收集范围（Phase 2 步⑤ 新增 `robot-package`）。
#
# ★ 为什么要把包内测试纳入**默认**范围
#   `robot-package/<id>/tests/` 放的是**这台机器人的构造事实**
#   （连杆命名、耦合结构、被动腕派生出的反例窗口…）。
#   它们不写进 testpaths 的话，`pytest -q` 会显示全绿而**从未执行**它们 ——
#   那是"伪造通过"，比没有测试更糟。
#
# ★ 为什么仍然允许显式传路径
#   `pytest tests/sim -q` 这类窄范围调用在工作时很常用（快得多）。
#   显式路径会**覆盖** testpaths，两条用法并存。
#
# ★ 刻意**不**设 `--import-mode=importlib`
#   现有测试大量依赖 `from conftest import ...` / `from harness import ...`
#   这类"裸模块名"导入，它们成立的唯一原因是 prepend 模式会把测试文件所在
#   目录塞进 `sys.path`。换成 importlib 模式会让这些导入**集体失效**，
#   表现为一大堆与本次改动无关的 `ModuleNotFoundError`。
testpaths =
    core/tests
    tests
    robot-package
