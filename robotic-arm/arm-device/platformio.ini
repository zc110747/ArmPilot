; =====================================================================
;  meArm 裸机 AVR 工程 (ATmega328P / Arduino Uno)
;  构建与下载由 scripts/build.bat、scripts/upload.bat 完成，
;  直接调用 PlatformIO 安装的 avr-gcc / avrdude (位于 D:\tools\agent-tools)。
;  PlatformIO 在此仅作为"工具链与板卡管理"：提供 toolchain-atmelavr /
;  tool-avrdude 安装，以及串口监视 (pio device monitor，可独立运行)。
;  固件本身为纯 C/C++ + avr-libc，不链接任何 Arduino 框架代码。
; =====================================================================
[env:uno]
platform = atmelavr
board = uno
upload_port = COM4
monitor_port = COM4
monitor_speed = 9600
