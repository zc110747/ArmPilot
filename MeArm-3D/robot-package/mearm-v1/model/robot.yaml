# =============================================================================
# ArmPilot · mARM 机器人模型配置（唯一数据源）
# -----------------------------------------------------------------------------
# 本文件是虚拟机械臂（Three.js）与真实机械臂（mARM / AVR）共用的**唯一模型定义**。
# 前端 RobotModel、FK、IK、标定、安全校验全部由此文件派生；
# 修改本文件即可改变模型，禁止在业务代码里硬编码任何尺寸 / 角度 / 限位。
#
# 硬件基线：开源 meArm（4 舵机，ATmega328P / Arduino Uno）
#   固件强制范围：S9 30..150 / S8 20..100 / S7 80..160 / S6 40..130
#   固件开机位：全部 90°；来源 MeArm-Device/bsp/servo.h + core/cmd.c
#
#   ⚠️ 舵机 -> 关节的**角色映射以实测为准**（2026-09-12，白色分割背景 + 舵机逐度
#      扫描 + 相机照片量化，见 docs/hardware-measurement.md）：
#        S9 -> base      底座旋转（绕竖直轴）
#        S7 -> shoulder  大臂/下臂（实测：扫 S7 时整条臂绕肩枢轴刚性转动）
#        S8 -> elbow     小臂/前臂（实测：扫 S8 时只有前臂动，下臂纹丝不动）
#        S6 -> gripper   夹取
#      固件里的 "left / right" 只是舵机的物理安装位称呼，**不等于** kinematic 角色；
#      按它分配肩/肘会得到反向的机构（这是本次修正的一处真实缺陷）。
#
#   ⚠️ 小臂是**绝对角**：真机由独立舵机经平行四连杆驱动。实测（tools/fit_pose.py，
#      把 FK 骨架拟合到实拍照片）扫 S7 使**肩关节**转过 52.91° 时，
#      小臂**绝对倾角只漂 10.08°**（而相对角变了 42.83°）⇒ 小臂角与肩角解耦。
#      模型用关节耦合 (coupling.gain = -1) 精确表达这一事实。
#      （残余漂移约 19%：平行四连杆不完全等长 + 枢轴像素定位误差。若按实测残差
#        硬拟合，等效增益 ≈ -0.81；模型取理论值 -1，见 docs/hardware-measurement.md。）
#
#   ⚠️ 腕（tool）是**被动关节**：爪的**绝对倾角同样被连杆锁住**，与肘部再解耦一层。
#      实测（2026-09-13 受控实验：定机位 S8 扫描 + 爪指轴线画回原图复核）：
#      小臂绝对倾角变 29.24° 时，**爪指的绝对倾角只变 7.31°**（折角反向补偿 21.93°）
#      ⇒ 爪近似恒水平。建模：`wrist 值 = 90` + `coupling{gain:-1}` 到 elbow，
#      于是爪的绝对倾角 ≡ 90°，**与 J2/J3 都无关**。
#      这条改动让「肘 → TCP」不再是一条固定长的直线段：
#      IK 必须先减去腕→TCP 的常量水平偏移 (40mm) 再做平面 2R（几何量：L1=80、L2=80）。
#      ⚠️ 关节链因此是「两根 80 的杆 + 一段 40 的水平爪」——**L2 ≠ 120**。
#
#   标定（offset / scale）与限位**全部由 2026-09-12 实拍反解**，不再沿用推定值：
#        S7 增益 0.694 关节度/舵机度   S8 增益 0.418 关节度/舵机度
#      数值自洽：四个舵机代入 90° 恰好得到下方 homePose。
#
#   机构尺寸取开源 meArm 标称值（base 60 / 大臂 80 / 小臂 80 / 手部 40），
#   后续实测微调只需改本文件的数字。
#   显示几何（geometry / details）按开源 meArm 实物外观参数化拼装：
#   蓝色倒角薄板 + 4 个黑色舵机（S9 底座 / S7 肩 / S8 肘 / S6 夹取）+ 金属轴销。
#   **改 geometry 只影响外观，绝不影响 FK / IK / 标定。**
# -----------------------------------------------------------------------------
# 单位约定（详见 docs/coordinate-system.md）：
#   长度 mm；角度 degree；坐标系为右手系 Z-up
#   X = 前后（+X 正前方）  Y = 左右（+Y 左）  Z = 上下（+Z 上）
#
# 【运动学链规则 —— 只需记住这一条】
#   一根连杆沿「其近端关节坐标系」的 +Z 方向伸展 `length`，末端就是下一个关节的坐标系原点
#   （再叠加该关节可选的 origin.position 附加偏移）。
#   因此**改 length 即改机构尺寸**，无需同步修改任何关节字段。
# =============================================================================

version: 1

robot:
  id: mearm
  name: mARM
  # ---------------------------------------------------------------------------
  # ★ 版本标识（冻结记录，非运动学量）
  #
  # `MeArm-V1` 是 ArmPilot 的**第一个正式 Robot Model**，也是后续所有通用化开发的
  # Reference Robot / Golden Baseline。它不是一个"待替换的旧模型"，而是被冻结的基准。
  #
  # 本字段的作用只是给"被冻结的那一个模型"一个可引用的名字，使
  #   「抽象前后行为一致」这句验收话可以被机器检查
  #   （见 frontend/src/robot/model/RobotModel.ts 的 model / modelVersion）。
  #
  # 冻结判据见 docs/architecture/mearm-v1-baseline.md：
  #   改外观（links[].geometry / details）⇒ 放行
  #   改运动学（length / joints / actuators）或物理量 ⇒ 报错
  # ⚠️ 它**不在** `tools/freeze_baseline.py` 的语义核心白名单里
  #    （白名单 = id/name/units/tcp/homePose），所以加它不会触发真值告警。
  # ---------------------------------------------------------------------------
  model: MeArm-V1
  version: 1.0.0
  units: mm

  # 工具中心点（TCP / End Effector）：指定关节坐标系下的固定偏移点。
  # tool 关节是**被动腕关节**（爪锁水平），其坐标系位于腕枢轴；向外 40mm 即夹爪铰点。
  # 参考关节刻意取 tool（而非 gripper），使 TCP 姿态只由 J1/J2/J3 决定（腕角由 coupling 派生），
  # 不被夹爪开合角污染。
  tcp:
    joint: tool
    offset: [0, 0, 40]

  # 开机 / HOME 位姿（关节角，degree）。
  # 数值 = 固件开机位（全部舵机 90°）的真实物理姿态，由 2026-09-12 相机实测反算
  # （tools/fit_pose.py：把 FK 骨架拟合到 RESET 照片，残差 ≈25px），
  # 且与下方 actuators 的 offset/scale **严格自洽**（代入标定式回算恰好都是 90°）：
  #   base     0°     —— 正前方（舵机 90° 即中位）
  #   shoulder 0.85°  —— 大臂近乎竖直（实测大臂轴线仅前倾 0.85°）
  #   elbow  112.62°  —— 小臂**绝对倾角**：前臂指向正前偏下约 22.6°（= 112.62° 离天顶）
  #   gripper  50°    —— 两爪约半开（与 RESET 照片一致）
  # 注意 elbow 存的是绝对角（见关节 coupling），故 FK 里的局部旋转 = 112.62 − 0.85 = 111.77°。
  homePose:
    base: 0
    shoulder: 0.8498937633
    elbow: 112.6185771989
    gripper: 50

# -----------------------------------------------------------------------------
# 连杆（Link）：几何量。链序为 root -> tip。
#   length：沿近端关节坐标系 +Z 的伸展长度（mm）—— **运动学量，唯一真值**
#   geometry：仅用于 3D 显示，不参与运动学。position 为相对近端坐标系的偏移。
#   details：附加显示件（舵机 / 螺栓 / 轴销），挂同一坐标系，同样不参与运动学。
#
# 显示几何类型（详见 frontend/src/robot/model/Link.ts）：
#   plate    倒角薄板 { size, cornerRadius }        —— 低多边形工程外观主力件
#   box      直角方盒 { size }                      —— 无倒角的连接件
#   cylinder 圆柱   { radius, height, radialSegments }
#   sphere   球体   { radius }
#   servo    舵机   { size?, shaftLength?, ears? }   —— 壳体 + 安装耳 + 金属输出轴 + 舵盘
#   none     不出几何
#
#   ⚠️ servo 本体约定：**局部 +Z = 输出轴方向，原点 = 壳体中心**。
#      轴朝上（+Z）不写 rotation；轴朝 +Y 写 rotation: [-90, 0, 0]；轴朝 +X 写 rotation: [0, 90, 0]。
#
# 机构布置（与实物 meArm 对齐）：
#   base_link    固定底盘 + 四角螺栓 + S9 底座舵机（平躺居中，输出轴朝上）
#   column_link  转盘（随 base 旋转）+ 两片立柱侧板 + S7 肩舵机（顶部，轴沿 Y）
#   upper_arm    两片大臂侧板 + 端部横撑 + S8 肘舵机（末端，轴沿 Y）
#   forearm      两片小臂侧板 + 腕部支座
#   tool         腕座 + S6 夹取舵机（轴沿 X，与夹爪铰轴同向）+ 爪铰轴
#   jaw          仅提供两片爪的尺寸（本体由渲染层特例化为对称开合），不出独立几何
# -----------------------------------------------------------------------------
links:

  # ---- 固定底盘（链根）：不随任何关节运动 ------------------------------------
  - id: base_link
    name: Base
    parent: null
    length: 0
    geometry:
      type: plate
      size: [94, 82, 7]
      cornerRadius: 5
      position: [0, 0, 3.5]
      color: "#232830"
    details:
      # 四角安装螺栓
      - { type: cylinder, radius: 4.2, height: 3, position: [37, 31, 8.5], color: "#161a21" }
      - { type: cylinder, radius: 4.2, height: 3, position: [-37, 31, 8.5], color: "#161a21" }
      - { type: cylinder, radius: 4.2, height: 3, position: [37, -31, 8.5], color: "#161a21" }
      - { type: cylinder, radius: 4.2, height: 3, position: [-37, -31, 8.5], color: "#161a21" }
      # S9 底座舵机：平躺居中，输出轴（+Z）朝上驱动转盘
      - type: servo
        position: [0, 0, 19.5]
        color: "#2f3644"

  # ---- 立柱总成：随 base 关节绕 Z 旋转 --------------------------------------
  - id: column_link
    name: Column
    parent: base_link
    length: 60
    geometry:
      type: plate
      size: [66, 60, 7]
      cornerRadius: 4
      position: [0, 0, 34]
      color: "#232830"
    details:
      # 两片立柱侧板（夹住 S9 舵机体）
      - { type: plate, size: [30, 6, 22], cornerRadius: 2, position: [0, 13, 49], color: "#232830" }
      - { type: plate, size: [30, 6, 22], cornerRadius: 2, position: [0, -13, 49], color: "#232830" }
      # S7 肩舵机：装在立柱顶，输出轴沿 Y（肩关节轴）
      - type: servo
        rotation: [-90, 0, 0]
        position: [0, 0, 60]
        color: "#2f3644"

  # ---- 大臂（肩 -> 肘）------------------------------------------------------
  - id: upper_arm_link
    name: UpperArm
    parent: column_link
    length: 80
    geometry:
      type: plate
      size: [22, 5, 74]
      cornerRadius: 2
      position: [0, 14, 37]
      color: "#232830"
      # 照片纹理（相对 assets/textures/ 的 key）—— 纯外观，不影响 FK/IK。
      # 两侧板各自贴同一张：盒体两个大面的 uv 互为镜像，渲染层会自动处理，
      # 因此**不需要**判断哪一面朝外。
      texture: mearm/tiles/upper_arm_link.png
    details:
      - { type: plate, size: [22, 5, 74], cornerRadius: 2, position: [0, -14, 37], color: "#232830", texture: mearm/tiles/upper_arm_link.png }
      # 肩轴端盖
      - { type: cylinder, radius: 5.5, height: 4, position: [0, 17.5, 0], color: "#2b3446" }
      - { type: cylinder, radius: 5.5, height: 4, position: [0, -17.5, 0], color: "#2b3446" }
      # 端部横撑
      - { type: plate, size: [22, 28, 5], cornerRadius: 2, position: [0, 0, 68], color: "#232830" }
      # S8 肘舵机：装在大臂末端，输出轴沿 Y（肘关节轴）
      - type: servo
        rotation: [-90, 0, 0]
        position: [0, 0, 80]
        color: "#2f3644"

  # ---- 小臂（肘 -> 腕）------------------------------------------------------
  - id: forearm_link
    name: ForeArm
    parent: upper_arm_link
    length: 80
    geometry:
      type: plate
      size: [18, 5, 68]
      cornerRadius: 2
      position: [0, 13.5, 34]
      color: "#232830"
      texture: mearm/tiles/forearm_link.png
    details:
      - { type: plate, size: [18, 5, 68], cornerRadius: 2, position: [0, -13.5, 34], color: "#232830", texture: mearm/tiles/forearm_link.png }
      # 肘轴端盖（肘关节轴）
      - { type: cylinder, radius: 5, height: 4, position: [0, 16.5, 0], color: "#2b3446" }
      - { type: cylinder, radius: 5, height: 4, position: [0, -16.5, 0], color: "#2b3446" }
      # 腕部横撑
      - { type: plate, size: [18, 22, 5], cornerRadius: 2, position: [0, 0, 64], color: "#232830" }
      # ★ 腕端延伸段（两片，d07）：小臂侧板原本到 z=68 就断了，而腕点在 z=80
      #   —— 中间 12.5mm **完全没料**，侧视能直接看穿到背景（"空洞"）。
      #   那一段在实拍照片里被夹爪舵机 S6 的**贴纸反光**糊住，反解时未捕捉到，
      #   所以模型上一直是空的。现按"直接延伸填充"补满（68 → 80，与腕点齐平）。
      #   ⚠️ 用 `box` 而不是 `plate`：纹理管线（tools/make_texture.py 的
      #      load_plate_sizes）会把 details 里的 **plate** 枚举成"待拍板"，
      #      box 不在枚举范围内 —— 而它本来就不是外露装饰板，是**补料**，
      #      没有照片数据，也就没有纹理长宽比契约要守。
      #   ⚠️ 必须放在 details **末尾**：load_plate_sizes 用 `enumerate(details)` 的
      #      **下标**做别名映射（`forearm_brace` 就是 index 3 的别名）。插在中间会
      #      把后续下标整体挤错，测试当场报"指南提到脚本不认识的文件名"——
      #      这是个只在**插入位置**上才暴露的耦合，追加到末尾与它无冲突。
      #   ⚠️ 与主板取**首尾相接**（68 起，不重叠）：重叠会在同色共面处 z-fighting；
      #      接缝处主板 2mm 倒角形成的浅槽在近黑件上几乎不可见。
      - { type: box, size: [18, 5, 12], position: [0, 13.5, 74], color: "#232830" }
      - { type: box, size: [18, 5, 12], position: [0, -13.5, 74], color: "#232830" }

  # ---- 腕 / 手部总成（其近端关节 tool 是**被动腕关节**，爪锁水平）----------------
  #   length 40 = 腕枢轴 → 爪铰点的距离。爪锁水平时这段完全落在 +X，
  #   因此它是 IK 里那个"常量偏移"的来源（见 joints.tool 的说明）。
  - id: tool_link
    name: Tool
    parent: forearm_link
    length: 40
    geometry:
      type: plate
      size: [22, 26, 11]
      cornerRadius: 3
      position: [0, 0, 6]
      color: "#232830"
    details:
      # S6 夹取舵机：输出轴沿 X，与夹爪铰轴同向
      - type: servo
        rotation: [0, 90, 0]
        position: [0, 0, 26]
        color: "#2f3644"
      # 爪铰轴（沿 X）
      - { type: cylinder, radius: 3.2, height: 32, rotation: [0, 0, 90], position: [0, 0, 40], color: "#2b3446" }

  # ---- 夹爪：单片爪的**平面轮廓**（外形读自实拍近景，ADR D66）----------------
  #   本体由渲染层特例化为「两片爪绕**各自齿轮轴**对称开合」，不产生独立几何。
  #   字段含义见 frontend/src/robot/model/Link.ts 的 JawGeometry。
  #   ⚠️ 三条自洽关系**由渲染层推导**（jawRenderSpec），不在这里配平：
  #      ① 两齿轮中心距 = 2 × 分度圆半径(= toothDepth 中线) ⇒ 标准啮合；
  #      ② 爪指中线相对齿轮中心内偏 = 分度圆半径 − width/2；
  #      ③ 由 ①② 得 θ=0 时两爪内侧缘正好贴合。
  #   ⚠️ `length` 量的是「齿轮中心 → 爪尖」，与 plate 的 size 语义不同；
  #      `jaw_link.length`（运动学量）恒为 0，不受影响。
  - id: jaw_link
    name: Jaw
    parent: tool_link
    length: 0
    geometry:
      type: jaw
      length: 34            # 齿轮中心 → 爪尖
      thickness: 4.5
      width: 9              # 爪指根部全宽（= 2 × 分度圆半径）
      tipWidth: 3
      gearRadius: 12        # 齿顶圆半径
      gearTeeth: 16
      toothDepth: 3         # 齿高（齿顶圆 − 齿根圆）
      serrations: 9         # 内侧缘锯齿数（实拍近景约 9 个**浅**齿）
      serrationDepth: 0.75
      serrationSpan: [0.35, 0.92]
      tipSkew: 2.6          # 尖端斜切量
      neckInset: 1.6        # 外侧缘「脖子」内缩量（实拍爪指出盘后先收窄）
      neckAt: 0.32          # 脖子位置（占 length 比例）
      holeRadius: 3.4       # 齿轮盘中心装饰镂空
      color: "#2b323c"

# -----------------------------------------------------------------------------
# 关节（Joint）：运动学量
#   origin.position：**可选附加偏移**（mm），默认 [0,0,0]。
#                    父连杆长度已自动把坐标系推到本关节处，通常无需填写；
#                    仅当关节不与父连杆共线时才需要额外平移。
#   origin.rotation：父关节坐标系 -> 本关节坐标系 的固定旋转（intrinsic XYZ, degree）
#   axis：本关节坐标系下的旋转轴（单位向量）
#   关节角 θ：绕 axis 按右手定则旋转 θ 度；θ=0 时子连杆沿本坐标系 +Z 伸展
# -----------------------------------------------------------------------------
joints:

  # J1 底座旋转：θ=0 指向 +X（正前方），+θ 绕 Z 逆时针（朝 +Y / 左侧转）
  - id: base
    name: Base
    role: base
    type: revolute
    parentLink: base_link
    childLink: column_link
    axis: [0, 0, 1]
    origin:
      position: [0, 0, 0]
      rotation: [0, 0, 0]
    limit:
      min: -60
      max: 60

  # J2 大臂俯仰：θ=0 竖直向上，+θ 绕 Y 向 +X（前方）倾倒。
  # 限位 = 舵机 S7 硬限位 80..160 经标定反算（实测增益 0.694 关节度/舵机度）。
  - id: shoulder
    name: Shoulder
    role: shoulder
    type: revolute
    parentLink: column_link
    childLink: upper_arm_link
    axis: [0, 1, 0]
    origin:
      position: [0, 0, 0]
      rotation: [0, 0, 0]
    limit:
      min: -6.0936827341
      max: 49.454929245

  # J3 小臂俯仰：**存的是绝对倾角**（θ=0 指天顶，+θ 向前倾）。
  # 真机由独立舵机 S8 经平行四连杆驱动，与肩角解耦 —— 用 coupling 表达：
  # 串联网里的局部旋转 = 112.62 + (-1) × shoulder。
  # 限位 = 舵机 S8 硬限位 20..100 经标定反算（实测增益 0.418 关节度/舵机度）。
  - id: elbow
    name: Elbow
    role: elbow
    type: revolute
    parentLink: upper_arm_link
    childLink: forearm_link
    axis: [0, 1, 0]
    origin:
      position: [0, 0, 0]
      rotation: [0, 0, 0]
    coupling:
      joint: shoulder
      gain: -1
    limit:
      min: 108.4414852068
      max: 141.8582211436

  # J4 腕（**被动关节**，无独立自由度）：爪的**绝对倾角被平行四连杆锁住**。
  #
  # 实测依据（2026-09-13 受控实验：定机位 S8 扫描 + 爪指轴线画回原图复核，
  # 见 docs/hardware-measurement.md / docs/decisions.md）：
  #   只扫 S8，使小臂绝对倾角 137.68° → 108.44°（世界下倾 47.68° → 18.44°，Δ = 29.24°），
  #   而**爪指的画面倾角只从 +1.27° 变到 +8.58°（Δ = 7.31°）**
  #   ⇒ 腕处折角随姿态变了 21.93°，正好抵消小臂的摆动
  #   ⇒ 爪的**绝对倾角近似恒定（≈水平）**。
  #   （若爪刚性固连在小臂上，Δ爪 必须等于 Δ小臂 = 29.24°——实测直接否决了这一点。）
  #
  # 建模方式与 elbow 同构：值恒为 90（= 离天顶的绝对倾角；90 即水平指向正前方），
  # 串联网里的局部旋转 = 90 + (−1) × elbow ⇒ 爪的绝对倾角恒为 90°，与小臂无关。
  #
  #   ⚠️ `limit.min === limit.max` 是**被动关节的表达方式**：它没有输入，
  #      关节值取该限位（= 锁定值）。校验层强制要求被动关节 min === max 且不得挂执行器。
  #   ⚠️ 它**不进入** JointState / UI 滑杆 / JR 协议（`type` 不是 `revolute`）
  #      ⇒ JR 仍是四元组，`docs/serial-v1.md` 与固件一个字都不用改。
  #   ⚠️ 它的坐标系同时是 **TCP 参考系**（见上方 robot.tcp.joint），原点即**腕枢轴**。
  #      因此 `tool_link.length = 40` 是「腕枢轴 → 爪铰点」的**水平**前伸量
  #      （爪锁水平时它完全落在 +X 上，故 IK 可把目标点减去这个常量偏移后退化成 2R）。
  #   ⚠️ 实测残差：爪在两端读数为 +1.27° / +8.58°，均值 ≈ +4.9°（略下垂）。
  #      本处取**理论值 90°（严格水平）**——理由与 elbow 取理论 gain −1 而非拟合 −0.81 一致：
  #      平行四边形杆件平行于底盘，理论值就是水平；≈5° 的残差落在人工选点误差内，待细测收紧。
  - id: tool
    name: Tool
    role: tool
    type: passive
    parentLink: forearm_link
    childLink: tool_link
    axis: [0, 1, 0]
    origin:
      position: [0, 0, 0]
      rotation: [0, 0, 0]
    coupling:
      joint: elbow
      gain: -1
    limit:
      min: 90
      max: 90

  # 夹取：叶关节，**不参与末端定位**（IK 只解 J1/J2/J3）。
  # θ=0 完全闭合，θ=90 完全张开；铰轴取工具系 X 轴（爪沿 ±Y 分开）。
  - id: gripper
    name: Gripper
    role: gripper
    type: revolute
    parentLink: tool_link
    childLink: jaw_link
    axis: [1, 0, 0]
    origin:
      position: [0, 0, 0]
      rotation: [0, 0, 0]
    limit:
      min: 0
      max: 90

# -----------------------------------------------------------------------------
# 执行器（Actuator）：关节空间 -> 舵机空间的映射（标定），以及舵机硬件限位
#   servo = reverse ? (-θ * scale + offset) : (θ * scale + offset)
#   limits：**舵机**（0..180 度）硬件强制范围，与固件 bsp/servo.h 一致
#   channel：串口协议中的舵机 ID（arm-device: 6/7/8/9）
#
#   ⚠️ offset / reverse / scale 为 **2026-09-12 实拍反解值**（见
#      docs/hardware-measurement.md）：舵机逐度扫描 + 白底暗件分割 +
#      FK 骨架拟合（tools/fit_pose.py，对称 Chamfer，残差 ≈25px）。
#      **已确证的结构事实**：角色映射（S7=肩 / S8=肘）与「小臂绝对角（平行四连杆）」。
#      标定增益（S7 0.694 / S8 0.418 关节度/舵机度）来自 6–7 帧的线性拟合，
#      相关系数良好但绝对角仍有 ±5° 量级不确定度；
#      待第二次实测（加标尺 + 水平取景 + 正交投影）进一步收紧。**只改本文件，不要改代码。**
#
#   多舵机关节（spec §二十五）无需新增字段：给同一 jointId 写两条 actuator 即可，
#   上层 IK / UI / RobotState 完全无感。
# -----------------------------------------------------------------------------
actuators:

  - id: servo_9
    name: Base Servo
    jointId: base
    channel: 9
    offset: 90
    scale: 1
    reverse: false
    limits:
      min: 30
      max: 150

  # S7 = 大臂/肩（真机实测：扫它时整条臂绕肩枢轴刚性转动）
  # 锚点：舵机 90°（RESET）<-> 肩关节 0.85°（照片拟合值）
  - id: servo_7
    name: Shoulder Servo
    jointId: shoulder
    channel: 7
    offset: 88.776
    scale: 1.44018
    reverse: false
    limits:
      min: 80
      max: 160

  # S8 = 小臂/肘（真机实测：扫它时只有前臂动，下臂不动 ⇒ 绝对角 + 平行四连杆）
  # 锚点：舵机 90°（RESET）<-> 小臂绝对角 112.62°（照片拟合值）
  - id: servo_8
    name: Elbow Servo
    jointId: elbow
    channel: 8
    offset: 359.61
    scale: 2.39401
    reverse: true
    limits:
      min: 20
      max: 100

  - id: servo_6
    name: Gripper Servo
    jointId: gripper
    channel: 6
    offset: 40
    scale: 1
    reverse: false
    limits:
      min: 40
      max: 130

# -----------------------------------------------------------------------------
# 外观（渲染）参数 —— **只影响 Three.js 显示，不参与 FK / IK / 标定 / 限位**。
#
# 为什么照片纹理需要 exposureEv（实测，见 ADR D64）：
#   实拍是**按白色桌面曝光的**，黑色亚克力板因此落在 8bit 的 1~3 码值上
#   （tile 实测，全图口径：upper_arm_link 72.2% 像素 ≤3、forearm_link 77.0%；
#    L<40 的像素只用到 41 档码值）。
#   再经 three 的 sRGB→线性变换（sRGB 2 → 线性 0.0006）并乘上 <1 的辐照度，
#   板面渲染输出实测 L≈0.08，max=2.4 —— 贴图在板面上的信息是**被量化抹掉**的，
#   不是"偏暗"。等比例调光照救不回来：要把板面推到 L≈60 需要约 +6.2 EV，
#   而 +6EV 下板面只会摊成 3~4 级平台（41/60/74），成为假色斑，比纯黑更假。
#
# 所以本节的定位是**实验入口**，不是"调参凑结果"：
#   - exposureEv 用于检验"提亮能不能救回板面"（结论：收益上限很低）
#   - environmentIntensity / roughness 用于检验"靠高光与环境反射读出形体"
#     （黑亚克力的形状可读性来自镜面反射，与暗端数据无关）
#   ⚠️ 真正能把板面细节送进数据的是**拍摄端**：对板测光 / 补光重拍。
# -----------------------------------------------------------------------------
appearance:
  texturedPlate:
    # 照片纹理件接收的**环境反射强度**（0 = 完全关闭，行为与引入本特性前逐值一致）。
    # 环境纹理由程序化 RoomEnvironment + PMREM 生成，不依赖任何外部 HDR 资产。
    # ⚠️ 它**只作用于名字为 `plateTexture` 的材质**，其余材质逐像素不变
    #    （实测底座蓝板 ×1.0000、max|Δ|=0.00）。
    # ⚠️ 不要改回 `scene.environment`：一是它是**全局**的，会把整机非贴图件一并点亮
    #    （实测底座蓝板 ×3.3757）；二是 three 在 `material.envMap === null &&
    #    scene.environment !== null` 时**用 scene.environmentIntensity 覆盖
    #    material.envMapIntensity**（0.186.0 `WebGLRenderer.js:2736`）⇒
    #    逐材质"关掉环境反射"的设计在全局方案下**根本不生效**
    #    （实测 V5/V6 统计逐位相同：L=59.17 / p05=57.36 / max=78.2）。
    # 实测（ROI x[402,520) y[380,640)，n=30680 px，同机位）：0.25 → 板面 L=12.21、
    # hp_std 0.086→0.293。取 0.25 的理由：板面**仍暗于背景（22.7）**，剪影不糊进背景。
    environmentIntensity: 0.25
    # 贴图线性曝光补偿（EV，1 EV = 线性亮度 ×2）。
    # 实测结论：**收益上限很低，保持 0**。板面在 tile 里只用到 41 档码值，
    # 提亮只是放大量化台阶（推到 L≈60 需 +6.2 EV，而那时板面摊成 41/60/74 三级平台）。
    exposureEv: 0
    # 光泽度：亚克力是**光泽**材料，纯漫反射只会是一块黑。
    # 实测它**只缩放整体亮度、几乎不改变细节能量**：L 在 7.54~30.40 之间动了 4 倍，
    # hp_std 只在 0.364~0.405 之间动 11% ⇒ "再亮一点"换不来更多细节。
    roughness: 0.6
    # 金属度：亚克力是非金属，保持 0；调大会与 exposureEv 耦合放大高光（不要动）。
    metalness: 0
