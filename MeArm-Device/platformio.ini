; =====================================================================
;  meArm 裸机 AVR 工程 (ATmega328P / Arduino Uno)
;  构建与下载由 start.bat、flash.bat 完成（build.bat 只编译），
;  直接调用 PlatformIO 安装的 avr-gcc / avrdude。
;  工具链实际路径由 _env.bat 统一解析，不再硬编码盘符：
;    %PLATFORMIO_CORE_DIR%\packages
;    -> %USERPROFILE%\.platformio\packages        (PlatformIO 标准位置)
;    -> D:\tools\agent-tools\platformio-core\packages  (旧布局兼容)
;  PlatformIO 在此仅作为"工具链与板卡管理"：提供 toolchain-atmelavr /
;  tool-avrdude 安装，以及串口监视 (pio device monitor，可独立运行)。
;  固件本身为纯 C/C++ + avr-libc，不链接任何 Arduino 框架代码。
; =====================================================================
[env:uno]
platform = atmelavr
board = uno
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
