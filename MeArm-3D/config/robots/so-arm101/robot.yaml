# 关节：6 个 revolute（5 DOF 臂 + 夹爪）+ 1 个 fixed（TCP 帧）。
# `role` 一律不填 —— 本机的 shoulder_lift/elbow_flex 恰好能对上 MeArm 的角色名，
# 但 wrist_flex / wrist_roll 在现有枚举里无对应项，只填一半会让「有 role」变成
# 一个没有判据的半真命题；UI 缺省回退到 `joint.name`（如 `shoulder_pan`），
# 对 6 关节臂而言比 J1/J2/J3 更可读。
joints:
  - id: shoulder_pan
    type: revolute
    parentLink: base_link
    childLink: shoulder_link
    axis: [0, 0, 1]
    origin:
      position: [38.8353, -0.000008977, 62.4]
      rotation: [179.999847961, 0, -179.999847961]
      rotationConvention: rpy
    limit: {min: -110, max: 110}

  - id: shoulder_lift
    type: revolute
    parentLink: shoulder_link
    childLink: upper_arm_link
    axis: [0, 0, 1]
    origin:
      position: [-30.3992, -18.2778, -54.2]
      rotation: [-90.000210459, -90.000210459, 0]
      rotationConvention: rpy
    limit: {min: -100, max: 100}

  - id: elbow_flex
    type: revolute
    parentLink: upper_arm_link
    childLink: lower_arm_link
    axis: [0, 0, 1]
    origin:
      position: [-112.57, -28, 0]
      rotation: [0, 0, 90.000210459]
      rotationConvention: rpy
    limit: {min: -96.829867377, max: 96.829867377}

  - id: wrist_flex
    type: revolute
    parentLink: lower_arm_link
    childLink: wrist_link
    axis: [0, 0, 1]
    origin:
      position: [-134.9, 5.2, 0]
      rotation: [0, 0, -90.000210459]
      rotationConvention: rpy
    limit: {min: -95.000003441, max: 94.999996559}

  - id: wrist_roll
    type: revolute
    parentLink: wrist_link
    childLink: gripper_link
    axis: [0, 0, 1]
    origin:
      position: [0, -61.1, 18.1]
      rotation: [90.000210459, 2.789129899, 179.999847961]
      rotationConvention: rpy
    limit: {min: -157.210869746, max: 162.789130254}

  - id: gripper_frame
    # TCP 帧：**朝向取自 MJCF 的 gripperframe site**（与 URDF 的 gripper_frame_joint
    # 相差 90°；取 MJCF 才能让 FK 与 MuJoCo 一致。依据见 SOURCE.md §4.2）。
    type: fixed
    parentLink: gripper_link
    childLink: gripper_frame_link
    axis: [0.0, 0.0, 1.0]
    origin:
      position: [-7.9, -0.218121, -98.1274]
      rotation: [0, 90, 0]
      rotationConvention: rpy

  - id: gripper
    type: revolute
    parentLink: gripper_link
    childLink: moving_jaw_so101_v1_link
    axis: [0, 0, 1]
    origin:
      position: [20.2, 18.8, -23.4]
      rotation: [90.000210459, -0.000003004, 0]
      rotationConvention: rpy
    limit: {min: -10.000003004, max: 99.999996996}

# 执行器：官方 MJCF 是 6 个 <position>，`ctrlrange` **等于**关节范围、`gear=1`
# ⇒ 关节空间位置伺服，**不存在 offset/scale/reverse 标定**。
# 故 `unit: joint`：`limits` 就是关节可达区间本身，而不是 0..180 的舵机行程。
# 绝不为了塞进 0..180 而编一段并不存在的 scale —— 那会让标定从事实退化成凑数。
actuators:
  - id: so101_s1_shoulder_pan
    jointId: shoulder_pan
    channel: 1
    offset: 0.0
    scale: 1.0
    reverse: false
    unit: joint
    limits: {min: -110, max: 110}
  - id: so101_s2_shoulder_lift
    jointId: shoulder_lift
    channel: 2
    offset: 0.0
    scale: 1.0
    reverse: false
    unit: joint
    limits: {min: -100, max: 100}
  - id: so101_s3_elbow_flex
    jointId: elbow_flex
    channel: 3
    offset: 0.0
    scale: 1.0
    reverse: false
    unit: joint
    limits: {min: -96.829867377, max: 96.829867377}
  - id: so101_s4_wrist_flex
    jointId: wrist_flex
    channel: 4
    offset: 0.0
    scale: 1.0
    reverse: false
    unit: joint
    limits: {min: -95.000003441, max: 94.999996559}
  - id: so101_s5_wrist_roll
    jointId: wrist_roll
    channel: 5
    offset: 0.0
    scale: 1.0
    reverse: false
    unit: joint
    limits: {min: -157.210869746, max: 162.789130254}
  - id: so101_s6_gripper
