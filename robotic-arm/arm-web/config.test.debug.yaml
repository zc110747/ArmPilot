# 调试专用配置：COM4 + debug 日志（可见 [serial] TX 每条下发字节）+ 10ms 节流。
serial:
  port: "COM4"
  baud: 9600
  databits: 8
  stopbits: 1
  parity: "N"
  reconnect_sec: 3
  min_interval_ms: 10

web:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  ws_path: "/ws"

tcp:
  enabled: true
  host: "0.0.0.0"
  port: 9001

log_level: "debug"

joystick:
  x_servo: 9
  y_servo: 8
  invert_x: false
  invert_y: false
